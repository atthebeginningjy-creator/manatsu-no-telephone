<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>真夏のテレフォン</title>
    <style>
        body { 
            margin: 0; padding: 0; font-family: sans-serif; 
            background: #0f2027; color: #fff; min-height: 100vh;
        }

        /* 以前のリッチなスタイルを適用 */
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        
        .section {
            background: #1b2a32; /* 元の少し暗い落ち着いた背景 */
            border: 1px solid #334e5a; /* 元の枠線 */
            border-radius: 20px; /* 元の角丸 */
            padding: 30px; 
            margin-bottom: 25px;
        }

        h2 { margin-top: 0; display: flex; align-items: center; gap: 10px; }

        /* スプラッシュ画面 */
        #splash-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 9999; transition: opacity 1.5s ease;
        }
    </style>
</head>
<body>

    <!-- 自動遷移用スプラッシュ -->
    <div id="splash-screen">
        <h1>Special Thanks</h1>
        <p>真夏のテレフォン</p>
    </div>

    <div class="container">
        <!-- スクリーンショットに近いデザイン構成に戻しました -->
        <section class="section">
            <h2>🎵 楽曲を聴く</h2>
            <p>(音源プレイヤーエリア)</p>
        </section>

        <section class="section">
            <h2>💃 振付動画</h2>
            <p>(動画エリア)</p>
        </section>
    </div>

    <script>
        window.addEventListener('load', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                splash.style.opacity = '0';
                setTimeout(() => { splash.style.display = 'none'; }, 1500);
            }, 2000); 
        });
    </script>
</body>
</html>
