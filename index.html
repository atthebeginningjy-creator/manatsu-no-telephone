<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>真夏のテレフォン / 恋するオルゴール</title>
    <style>
        /* =========================================
           スペシャル演出（オープニング画面）のスタイル
        ========================================= */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #00c6ff, #0072ff); /* 夏の海・空のグラデーション */
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 1s ease; /* 消える時のフワッとしたアニメーション */
            overflow: hidden;
        }

        /* 購入者特典の文字 */
        .splash-title {
            font-size: 1.2rem;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
            z-index: 10;
        }

        .splash-main {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 40px;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.4);
            z-index: 10;
        }

        /* 開くボタン */
        .enter-btn {
            padding: 15px 40px;
            font-size: 1.1rem;
            color: #0072ff;
            background: #fff;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: transform 0.3s ease;
            z-index: 10;
            font-weight: bold;
        }

        .enter-btn:hover {
            transform: scale(1.05);
        }

        /* 泡（サイダー）のアニメーション設定 */
        .bubbles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .bubble {
            position: absolute;
            bottom: -50px;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            animation: rise infinite ease-in;
        }

        @keyframes rise {
            0% {
                bottom: -50px;
                transform: translateX(0);
                opacity: 0;
            }
            50% {
                opacity: 1;
            }
            100% {
                bottom: 110%;
                transform: translateX(-20px);
                opacity: 0;
            }
        }

        /* 泡のサイズと速度をバラバラにする */
        .bubble:nth-child(1) { width: 40px; height: 40px; left: 10%; animation-duration: 4s; }
        .bubble:nth-child(2) { width: 20px; height: 20px; left: 30%; animation-duration: 5s; animation-delay: 1s; }
        .bubble:nth-child(3) { width: 50px; height: 50px; left: 60%; animation-duration: 6s; }
        .bubble:nth-child(4) { width: 30px; height: 30px; left: 80%; animation-duration: 4.5s; animation-delay: 2s; }
        .bubble:nth-child(5) { width: 25px; height: 25px; left: 50%; animation-duration: 5.5s; animation-delay: 0.5s; }


        /* =========================================
           ここから下はメインLP（さきほどのコード）
        ========================================= */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #ff7e5f 100%);
            color: #fff;
            text-align: center;
            min-height: 100vh;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }

        .hero { margin: 20px 0; }
        .jacket-img {
            width: 100%;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            display: block;
        }

        .section {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 30px 20px;
            margin: 25px 0;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        .section h2 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            border-bottom: 2px solid rgba(255,255,255,0.3);
            padding-bottom: 10px;
        }

        .media-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.5%;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .media-wrapper iframe {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%; border: none;
        }

        .story-text {
            text-align: left; line-height: 1.8; font-size: 0.95rem; padding: 0 10px;
        }

        footer { padding: 30px 0; font-size: 0.8rem; opacity: 0.7; }
    </style>
</head>
<body>

    <!-- =========================================
         購入者限定 スペシャルオープニング画面
    ========================================= -->
    <div id="splash-screen">
        <div class="bubbles">
            <!-- 泡の要素 -->
            <div class="bubble"></div>
            <div class="bubble"></div>
            <div class="bubble"></div>
            <div class="bubble"></div>
            <div class="bubble"></div>
        </div>
        <div class="splash-title">購入者限定 SPECIAL PAGE</div>
        <div class="splash-main">真夏のテレフォン</div>
        <button class="enter-btn" onclick="hideSplash()">ページを開く</button>
    </div>

    <!-- =========================================
         メインLP
    ========================================= -->
    <div class="container">
        <header class="hero">
            <img src="1C5CA39B-DF14-4FF2-96CD-13F27FB509A6.png" alt="真夏のテレフォン ジャケット写真" class="jacket-img">
        </header>

        <section class="section">
            <h2>🎵 楽曲を聴く</h2>
            <div style="padding: 40px; background: rgba(0,0,0,0.3); border-radius: 8px;">
                <p>（ここに「真夏のテレフォン」の音源プレイヤーが入ります）</p>
            </div>
        </section>

        <section class="section">
            <h2>💃 みんなで踊ろう振付動画</h2>
            <div class="media-wrapper">
                <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);">
                    <p>振付動画 準備中</p>
                </div>
            </div>
            <p style="font-size: 0.9rem; opacity: 0.8;">サビの振付を覚えて一緒に踊ろう！</p>
        </section>

        <section class="section">
            <h2>📖 制作秘話</h2>
            <div class="story-text">
                <p><strong>【ここにエピソードが入ります】</strong></p>
                <p>「真夏のテレフォン」は、夏のきらめきと少し切ない距離感をテーマに制作されました。レコーディングの裏話や、歌詞に込めたこだわりなどを順次公開予定です。</p>
            </div>
        </section>

        <footer>
            <p>&copy; オタクのいちごさん All Rights Reserved.</p>
        </footer>
    </div>

    <!-- 画面を消すためのJavaScript -->
    <script>
        function hideSplash() {
            const splash = document.getElementById('splash-screen');
            // フワッと消えるように透明度を0にする
            splash.style.opacity = '0';
            
            // 1秒後（フェードアウト完了後）に完全に非表示にする
            setTimeout(() => {
                splash.style.display = 'none';
            }, 1000);
        }
    </script>
</body>
</html>
