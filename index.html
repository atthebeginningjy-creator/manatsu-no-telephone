<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>真夏のテレフォン / 恋するオルゴール</title>
    <style>
        /* =========================================
           Special Thanks オープニング（2秒で自動遷移）
        ========================================= */
        #splash-screen {
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            background: linear-gradient(135deg, #00c6ff, #0072ff, #ff7e5f);
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            z-index: 9999; 
            transition: opacity 1.5s ease;
        }
        
        .splash-thanks { 
            font-size: 2.4rem; 
            font-style: italic; 
            letter-spacing: 6px; 
            margin-bottom: 15px; 
            color: #fff; 
            font-family: 'Georgia', 'Times New Roman', serif;
        }
        
        .splash-sub {
            font-size: 0.95rem;
            letter-spacing: 4px;
            margin-bottom: 30px;
            color: #fff;
            opacity: 0.9;
        }

        .splash-main { 
            font-size: 2.8rem; 
            font-weight: bold; 
            letter-spacing: 2px; 
            color: #fff; 
            text-shadow: 2px 2px 8px rgba(0,0,0,0.4);
        }

        /* =========================================
           LP全体のデザイン（リッチ・夏仕様）
        ========================================= */
        body {
            margin: 0; 
            padding: 0; 
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            color: #fff; 
            text-align: center; 
            min-height: 100vh;
        }

        .container { 
            max-width: 600px; 
            margin: 0 auto; 
            padding: 30px 20px; 
        }

        .hero { 
            margin: 10px 0 30px 0; 
        }

        .jacket-img {
            width: 100%; 
            height: auto; 
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            display: block; 
            border: 2px solid rgba(255,255,255,0.2);
        }

        /* セクション（ガラスモーフィズム＋夏色のアクセント） */
        .section {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px; 
            padding: 35px 25px; 
            margin: 30px 0;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            position: relative; 
            overflow: hidden;
        }

        .section::before {
            content: ''; 
            position: absolute; 
            top: 0; 
            left: 0; 
            right: 0; 
            height: 3px;
            background: linear-gradient(90deg, #00c6ff, #ff7e5f);
        }

        .section h2 { 
            font-size: 1.4rem; 
            margin-top: 0; 
            margin-bottom: 20px; 
            letter-spacing: 1px; 
            text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
        }

        .media-wrapper {
            position: relative; 
            width: 100%; 
            padding-top: 56.5%;
            background: #000; 
            border-radius: 10px; 
            overflow: hidden; 
            margin-bottom: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .media-wrapper iframe { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            border: none; 
        }
        
        .story-text {
            text-align: left; 
            line-height: 1.9; 
            font-size: 0.95rem; 
            color: rgba(255, 255, 255, 0.9);
        }

        footer { 
            padding: 40px 0; 
            font-size: 0.8rem; 
            letter-spacing: 1px; 
            opacity: 0.6; 
        }
    </style>
</head>
<body>

    <!-- オープニング演出 -->
    <div id="splash-screen">
        <div class="splash-thanks">Special Thanks</div>
        <div class="splash-sub">For All Purchasers</div>
        <div class="splash-main">真夏のテレフォン</div>
    </div>

    <!-- メインLP -->
    <div class="container">
        <header class="hero">
            <img src="1C5CA39B-DF14-4FF2-96CD-13F27FB509A6.png" alt="真夏のテレフォン ジャケット写真" class="jacket-img">
        </header>

        <section class="section">
            <h2>🎵 楽曲を聴く</h2>
            <div style="padding: 40px; background: rgba(0,0,0,0.2); border-radius: 10px; border: 1px dashed rgba(255,255,255,0.2);">
                <p style="opacity: 0.7; font-size: 0.9rem;">（ここに「真夏のテレフォン」の音源プレイヤーが入ります）</p>
            </div>
        </section>

        <section class="section">
            <h2>💃 みんなで踊ろう振付動画</h2>
            <div class="media-wrapper">
                <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); opacity: 0.7;">
                    振付動画 準備中
                </div>
            </div>
            <p style="font-size: 0.9rem; opacity: 0.8; margin-top: 15px;">サビの振付を覚えて一緒に踊ろう！</p>
        </section>

        <section class="section">
            <h2>📖 制作秘話</h2>
            <div class="story-text">
                <p><strong>【エピソード】</strong></p>
                <p>「真夏のテレフォン」は、夏のきらめきと少し切ない距離感をテーマに制作されました。レコーディングの裏話や歌詞に込めたこだわりを公開予定です。</p>
            </div>
        </section>

        <footer>&copy; オタクのいちごさん All Rights Reserved.</footer>
    </div>

    <!-- 自動切り替えスクリプト（2秒後にフェードアウト） -->
    <script>
        window.addEventListener('load', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                splash.style.opacity = '0';
                setTimeout(() => { 
                    splash.style.display = 'none'; 
                }, 1500);
            }, 2000); 
        });
    </script>
</body>
</html>
