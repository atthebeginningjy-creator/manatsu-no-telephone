<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>真夏のテレフォン - Special Page</title>
    <style>
        /* 全体のベース */
        body { margin: 0; padding: 0; font-family: sans-serif; background: #0f2027; color: #fff; overflow-x: hidden; }

        /* =========================================
           Special Thanks オープニング（自動遷移）
        ========================================= */
        #splash {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #00c6ff, #0072ff, #ff7e5f);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 9999; transition: opacity 1.5s ease;
        }

        /* 泡アニメーション（画面全体） */
        .bubble-container { position: absolute; width: 100%; height: 100%; pointer-events: none; overflow: hidden; }
        .bubble { position: absolute; bottom: -50px; background: rgba(255,255,255,0.4); border-radius: 50%; animation: rise 5s infinite; }
        @keyframes rise { 
            0% { transform: translateY(0); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(-110vh); opacity: 0; }
        }

        /* =========================================
           メインページ（リッチ・夏仕様）
        ========================================= */
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .hero { margin: 20px 0; }
        .jacket-img { width: 100%; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        .section {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 16px; padding: 30px; margin: 30px 0;
            /* 全体にシュワシュワ感を出すためのうっすらとした光のグラデ */
            box-shadow: inset 0 0 20px rgba(0,198,255,0.1);
        }
    </style>
</head>
<body>

    <!-- 自動遷移するオープニング -->
    <div id="splash">
        <div class="bubble-container">
            <div class="bubble" style="left:10%; width:30px; height:30px; animation-delay:0s"></div>
            <div class="bubble" style="left:40%; width:50px; height:50px; animation-delay:1s"></div>
            <div class="bubble" style="left:70%; width:20px; height:20px; animation-delay:2s"></div>
        </div>
        <h1 style="font-family:serif; font-style:italic; font-size:2.5rem;">Special Thanks</h1>
        <p style="letter-spacing:5px;">For All Purchasers</p>
        <h2 style="font-size:2rem;">真夏のテレフォン</h2>
    </div>

    <!-- メインLP -->
    <div class="container">
        <header class="hero">
            <img src="1C5CA39B-DF14-4FF2-96CD-13F27FB509A6.png" class="jacket-img">
        </header>

        <section class="section">
            <h2>🎵 楽曲を聴く</h2>
            <p>（音源プレイヤーエリア）</p>
        </section>

        <section class="section">
            <h2>💃 振付動画</h2>
            <p>（動画エリア）</p>
        </section>
    </div>

    <script>
        // 4秒後に自動でフェードアウトして消す
        window.onload = () => {
            setTimeout(() => {
                const splash = document.getElementById('splash');
                splash.style.opacity = '0';
                setTimeout(() => { splash.style.display = 'none'; }, 1500);
            }, 4000);
        };
    </script>
</body>
</html>
