<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>恋するオルゴール - 限定特典ページ（真夏のテレフォン）</title>
    <style>
        :root {
            --bg-dark: #0a0e17;
            --bg-box: #1a120b;
            --gold-primary: #d4af37;
            --gold-light: #f3e5ab;
            --text-main: #f5f5f4;
            --text-sub: #b5a48c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Times New Roman', 'Noto Serif JP', 'Shippori Mincho', serif;
            line-height: 1.8;
            letter-spacing: 0.08em;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        #particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        #opening-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 2.0s ease, transform 2.0s ease;
            transform-origin: top center;
        }

        #opening-overlay.fade-out {
            opacity: 0;
            transform: scaleY(0);
            pointer-events: none;
        }

        .opening-box {
            text-align: center;
            color: var(--gold-primary);
            animation: pulse 2s infinite alternate;
        }

        @keyframes pulse {
            0% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        .wrapper {
            position: relative;
            z-index: 10;
            max-width: 500px;
            margin: 0 auto;
            padding: 40px 20px 80px 20px;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 2.5s ease 0.5s, transform 2.5s ease 0.5s;
        }

        .wrapper.visible {
            opacity: 1;
            transform: translateY(0);
        }

        section {
            background: linear-gradient(135deg, #1f160e 0%, var(--bg-box) 100%);
            border: 1px solid rgba(212, 175, 55, 0.25);
            box-shadow: 0 10px 30px rgba(0,0,0,0.7), inset 0 0 15px rgba(212,175,55,0.05);
            border-radius: 8px;
            padding: 30px 20px;
            margin-bottom: 40px;
            text-align: center;
            position: relative;
        }

        section::before {
            content: '';
            position: absolute;
            top: 5px; left: 5px; right: 5px; bottom: 5px;
            border: 1px solid rgba(212, 175, 55, 0.05);
            border-radius: 6px;
            pointer-events: none;
        }

        h2 {
            font-size: 1.1rem;
            color: var(--gold-primary);
            text-transform: uppercase;
            letter-spacing: 0.2em;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        h2::before, h2::after {
            content: '♦';
            font-size: 0.6rem;
            margin: 0 10px;
            color: var(--gold-primary);
            opacity: 0.7;
        }

        .jacket-area {
            position: relative;
            width: 95%;
            margin: 0 auto 25px auto;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            border: 1px solid rgba(212, 175, 55, 0.15);
            background-color: #111;
        }

        .jacket-area img {
            width: 100%;
            display: block;
            object-fit: cover;
        }

        .main-title {
            font-size: 1.6rem;
            color: var(--gold-light);
            text-shadow: 0 0 10px rgba(243, 229, 171, 0.3);
            margin-bottom: 15px;
            font-weight: normal;
        }

        .catchphrase {
            font-size: 0.85rem;
            color: var(--text-sub);
            white-space: pre-wrap;
            line-height: 1.6;
        }

        .btn-gold {
            display: inline-block;
            width: 90%;
            max-width: 280px;
            padding: 14px 0;
            background: linear-gradient(135deg, #d4af37 0%, #aa841e 100%);
            color: #1a120b;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.95rem;
            border-radius: 40px;
            box-shadow: 0 4px 15px rgba(214,175,55,0.3);
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            letter-spacing: 0.15em;
        }

        .btn-gold:hover {
            filter: brightness(1.1);
        }

        .btn-gold:active {
            transform: scale(0.97);
            box-shadow: 0 2px 5px rgba(214,175,55,0.2);
        }

        .video-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        .video-container iframe {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border: none;
        }

        .coming-soon {
            font-size: 1rem;
            color: var(--text-sub);
            font-style: italic;
            letter-spacing: 0.15em;
            padding: 20px 0;
        }

        .message-text {
            font-size: 0.9rem;
            text-align: left;
            padding: 0 10px;
            white-space: pre-wrap;
            color: var(--text-main);
        }

        .message-signature {
            text-align: right;
            margin-top: 25px;
            font-size: 0.95rem;
            color: var(--gold-light);
            line-height: 1.6;
            padding-right: 10px;
        }

        .secret-block {
            margin-bottom: 25px;
            text-align: center;
            padding: 0 5px;
        }

        .secret-title {
            font-size: 0.95rem;
            color: var(--gold-light);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .secret-title::before, .secret-title::after {
            content: '✦';
            color: var(--gold-primary);
            margin: 0 8px;
            font-size: 0.8rem;
        }

        .board-img-wrap {
            width: 100%;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid rgba(212, 175, 55, 0.3);
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            transition: transform 0.3s ease;
            margin-bottom: 15px;
        }

        .board-img-wrap:hover {
            transform: scale(1.02);
        }

        .board-img-wrap img {
            width: 100%;
            height: auto;
            display: block;
        }

        footer {
            text-align: center;
            font-size: 0.7rem;
            color: var(--text-sub);
            opacity: 0.5;
            margin-top: 20px;
            letter-spacing: 0.1em;
        }
    </style>
</head>
<body>

    <!-- シュワシュワのエフェクト用キャンバス -->
    <canvas id="particles"></canvas>

    <!-- オープニングのローディング画面 -->
    <div id="opening-overlay">
        <div class="opening-box">
            <p style="font-size: 0.75rem; letter-spacing: 0.3em; text-transform: uppercase; margin-bottom: 10px;">Premium Special Page</p>
            <div style="font-size: 1.5rem; font-weight: 300;">Loading...</div>
        </div>
    </div>

    <div class="wrapper" id="main-wrapper">
        
        <!-- ジャケット写真・タイトル -->
        <section id="sec-top">
            <div class="jacket-area">
                <img id="lp-jacket" src="" alt="Jacket Image">
            </div>
            <h1 class="main-title" id="lp-title">---</h1>
            <p class="catchphrase" id="lp-catchphrase">---</p>
        </section>

        <!-- 音源リンク -->
        <section id="sec-music">
            <h2>Music</h2>
            <div id="music-content"></div>
        </section>

        <!-- 振付動画 (現在はカミングスーン) -->
        <section id="sec-choreography">
            <h2>Choreography Video</h2>
            <div id="mv-content">
                <div class="coming-soon">Coming Soon...</div>
            </div>
        </section>

        <!-- 購入者へのメッセージ -->
        <section id="sec-message">
            <h2>Message</h2>
            <p class="message-text" id="lp-message">---</p>
            <div class="message-signature" id="lp-signature"></div>
        </section>

        <!-- 制作秘話と手書きメッセージ -->
        <section id="sec-secret">
            <h2>Secret Contents</h2>
            
            <div class="secret-block">
                <div class="secret-title">『真夏のテレフォン』制作秘話</div>
                <div class="secret-content-body" id="secret1-content"></div>
            </div>

            <hr style="border: none; border-top: 1px dashed rgba(214, 175, 55, 0.15); margin-bottom: 25px;">

            <div class="secret-block">
                <div class="secret-title">メンバーからの手書きスペシャルメッセージ</div>
                <!-- カミングスーン表示 -->
                <div class="coming-soon">Coming Soon...</div>
            </div>
        </section>

        <footer>
            &copy; <span id="current-year"></span> Premium Music Card. All Rights Reserved.
        </footer>
    </div>

    <script>
        const CONFIG = {
            // タイトルとキャッチフレーズ
            title: "真夏のテレフォン",
            catchphrase: "真夏のテレフォン\n･･････つないだ想い、届くよね♡", 
            
            // ① ジャケット写真
            jacketUrl: "./manatsu.png.PNG", 

            // ② 音源リンク
            musicYoutubeUrl: "https://youtu.be/LM0vAY1e9GM",
            
            // ③ 制作秘話の画像とリンク
            secret1Url: "https://youtu.be/oe1iUgGIB14",
            secret1ImgUrl: "./夏テレ秘話.png.png",

            // ④ 購入者様へのメッセージ (適宜書き換えてください)
            message: `この度は、セカンドシングル「真夏のテレフォン」をご購入いただき、本当にありがとうございます！
第一弾の「星屑パスポート」に続き、こうして皆さんに新しい曲をお届けできること、心から感謝しています。

今回の曲は、夏の海辺や受話器越しのドキドキをテーマにした、爽やかで元気いっぱいのサマーチューンです！
皆さんのひと夏が、この曲を通してもっとキラキラ輝くものになりますように。

私たち「恋するオルゴール」は、これからも皆さんと一緒に夢に向かって走っていきます。
今年の夏は「真夏のテレフォン」をたくさん聴いて、一緒に最高の思い出を作りましょうね♪

これからも応援、よろしくお願いします！`,

            signature: `恋するオルゴール
早坂恵美
宮本直美`
        };

        document.addEventListener("DOMContentLoaded", () => {
            // 基本情報の設定
            document.getElementById("lp-title").innerText = CONFIG.title;
            document.title = `${CONFIG.title} - 限定特典ページ`;
            document.getElementById("lp-catchphrase").innerText = CONFIG.catchphrase;
            document.getElementById("lp-jacket").src = CONFIG.jacketUrl;
            document.getElementById("lp-message").textContent = CONFIG.message;
            document.getElementById("lp-signature").textContent = CONFIG.signature;
            document.getElementById("current-year").innerText = new Date().getFullYear();

            // 音源ボタンの生成
            const musicContent = document.getElementById("music-content");
            if(CONFIG.musicYoutubeUrl) {
                const btn = document.createElement("a");
                btn.href = CONFIG.musicYoutubeUrl;
                btn.target = "_blank";
                btn.className = "btn-gold";
                btn.innerText = "楽曲を聴く";
                musicContent.appendChild(btn);
            }

            // 制作秘話エリアの生成
            const secret1Content = document.getElementById("secret1-content");
            let secret1Html = "";

            if (CONFIG.secret1ImgUrl) {
                secret1Html += `
                    <div class="board-img-wrap">
                        <a href="${CONFIG.secret1Url || '#'}" target="_blank">
                            <img src="${CONFIG.secret1ImgUrl}" alt="真夏のテレフォン 制作秘話">
                        </a>
                    </div>`;
            }

            if (CONFIG.secret1Url) {
                secret1Html += `
                    <a href="${CONFIG.secret1Url}" target="_blank" class="btn-gold" style="margin-top: 5px;">制作秘話を見る</a>`;
            }

            secret1Content.innerHTML = secret1Html;

            // オープニングアニメーション（1秒後にフェードアウト）
            setTimeout(() => {
                const overlay = document.getElementById("opening-overlay");
                const wrapper = document.getElementById("main-wrapper");
                overlay.classList.add("fade-out");
                wrapper.classList.add("visible");
            }, 1000);
        });

        // 背景のシュワシュワ（パーティクル）エフェクト
        const canvas = document.getElementById('particles');
        const ctx = canvas.getContext('2d');
        let dots = [];
        const maxDots = 25;

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Dot {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height + canvas.height;
                this.size = Math.random() * 1.5 + 0.5;
                this.speedY = Math.random() * 0.4 + 0.1;
                this.speedX = Math.sin(Math.random() * 2) * 0.2;
                this.alpha = Math.random() * 0.5 + 0.2;
            }
            update() {
                this.y -= this.speedY;
                this.x += this.speedX;
                if (this.y < 0) {
                    this.y = canvas.height;
                    this.x = Math.random() * canvas.width;
                }
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(243, 229, 171, ${this.alpha})`;
                ctx.shadowBlur = 4;
                ctx.shadowColor = '#d4af37';
                ctx.fill();
            }
        }

        for (let i = 0; i < maxDots; i++) {
            let d = new Dot();
            d.y = Math.random() * canvas.height;
            dots.push(d);
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            dots.forEach(d => {
                d.update();
                d.draw();
            });
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
